# zshell ↔ Hyprland glue. Add ONE line to your hyprland.conf:
#
#   source = ~/.config/quickshell/zshell/hypr/zshell.conf
#
# zshell never edits hyprland.conf itself.

exec-once = qs -c zshell

# ---- Frosted glass -----------------------------------------------------
# Blur every zshell surface except the wallpaper. ignorealpha keeps the
# fully transparent parts of a surface (e.g. around the island pill)
# unblurred, so the blur follows the rounded shape.
#
# Blur strength (size, passes, ...) is set live by zshell through hyprctl;
# turn that off with appearance.glass.manageHyprland = false.
#
# This uses the classic layerrule syntax. If your Hyprland version uses the
# newer rule syntax, translate these four lines (see the Hyprland wiki).
layerrule = blur, ^(zshell-(bar|island|panel|osd|notifications))$
layerrule = ignorealpha 0.1, ^(zshell-(bar|island|panel|osd|notifications))$
layerrule = noanim, ^(zshell-(wallpaper|island))$

# ---- Keybinds ------------------------------------------------------------
$zs = qs -c zshell ipc call

bind = SUPER, B, exec, $zs layout toggle
bind = SUPER SHIFT, G, exec, $zs glass toggle
bind = SUPER SHIFT, T, exec, $zs theme next
bind = SUPER SHIFT, W, exec, $zs wallpaper random
bind = SUPER SHIFT, N, exec, $zs notifications dnd

bindel = , XF86AudioRaiseVolume, exec, $zs volume up
bindel = , XF86AudioLowerVolume, exec, $zs volume down
bindl  = , XF86AudioMute, exec, $zs volume mute
bindl  = , XF86AudioMicMute, exec, $zs volume micMute
bindel = , XF86MonBrightnessUp, exec, $zs brightness up
bindel = , XF86MonBrightnessDown, exec, $zs brightness down
